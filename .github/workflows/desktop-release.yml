name: Desktop release

# LF-20 (update notice): a version tag (v1.2.3) builds the three desktop
# packages with that version and attaches them to a DRAFT GitHub release.
# Nothing is public until the owner reviews the draft and publishes it; the
# app's "Check for updates" only sees published, non-pre-release versions.
# The packages are unsigned (Apple and Windows signing are owner decisions).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # prisma.config.ts reads it; the build never connects.
  DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:1/placeholder

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Use the tag as the app version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH"; exit 1; }
          node -e 'const f="package.json";const p=JSON.parse(require("fs").readFileSync(f,"utf8"));p.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$version"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm prisma:generate
      - run: pnpm build:desktop
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: node scripts/package-linux.mjs
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: node scripts/package-windows.mjs
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: node scripts/package-macos.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist/release/*.dmg
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/*.zip
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Web Content Flow ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned desktop packages for macOS (Apple silicon), Windows and Linux. macOS and Windows will warn that the developer cannot be verified. Install over the previous version; projects stay on the computer. Checksums in SHA256SUMS.txt."
