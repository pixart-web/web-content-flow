# Web Content Flow — STAGING Blueprint (Render, ADR-058).
# Guide: docs/operations/18-render-staging-setup.md
#
# Region and plans: change them here before the first sync. All services and
# the database must share one region (private network). The database region
# and Postgres major version cannot change after creation.
#   web / worker / cron: 0.5c-512mb   database: 0.1c-256mb
# Auto-deploy is off: every deploy is a manual "Deploy latest commit".
# Preview environments are off. No secret values live in this file:
# AUTH_SECRET / RATE_LIMIT_SECRET are generated by Render, SMTP credentials
# are entered in the Dashboard (sync: false).

previews:
  generation: off

databases:
  - name: web-content-flow-staging-db
    databaseName: web_content_flow_staging
    user: web_content_flow
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: frankfurt
    postgresMajorVersion: "16"
    # Empty list = no access from the internet; services reach it over
    # Render's private network.
    ipAllowList: []

envVarGroups:
  - name: web-content-flow-staging-config
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: APP_ENV
        value: staging
      - key: DATABASE_ENVIRONMENT
        value: staging
      - key: NEXT_PUBLIC_APP_URL
        value: https://app-staging.webcontentflow.com
      - key: AUTH_URL
        value: https://app-staging.webcontentflow.com
      - key: ROLLOUT_STATE
        value: INVITE_ONLY
      # The env schema rejects any of these four set to true on staging.
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      - key: MARKETING_INDEXING_ENABLED
        value: "false"
      - key: MARKETING_CAPTURE_MODE
        value: "false"
      - key: AI_REAL_GENERATION_ENABLED
        value: "false"
      - key: AI_PROVIDER_DEFAULT
        value: MOCK
      - key: AI_FAKE_OPENAI_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: SMTP
      - key: SMTP_HOST
        value: mail.webcontentflow.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_FROM
        value: noreply@webcontentflow.com
      - key: SUPPORT_EMAIL
        value: support@webcontentflow.com

services:
  - type: web
    name: web-content-flow-staging-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    domains:
      - app-staging.webcontentflow.com
    maxShutdownDelaySeconds: 90
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build
    # Refuses unapproved destructive migrations, then applies pending ones.
    preDeployCommand: pnpm migrate:production
    startCommand: pnpm start
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: web-content-flow-staging-config
      - key: DATABASE_URL
        fromDatabase:
          name: web-content-flow-staging-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_RELEASE
        sync: false

  - type: worker
    name: web-content-flow-staging-worker
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 90
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma:generate
    startCommand: pnpm worker
    envVars:
      - fromGroup: web-content-flow-staging-config
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: web-content-flow-staging-db
          property: connectionString
      - key: AUTH_SECRET
        fromService:
          type: web
          name: web-content-flow-staging-web
          envVarKey: AUTH_SECRET
      - key: RATE_LIMIT_SECRET
        fromService:
          type: web
          name: web-content-flow-staging-web
          envVarKey: RATE_LIMIT_SECRET
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_RELEASE
        sync: false

  - type: cron
    name: web-content-flow-staging-maintenance
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    schedule: "17 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma:generate
    startCommand: pnpm maintenance
    envVars:
      - fromGroup: web-content-flow-staging-config
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: web-content-flow-staging-db
          property: connectionString
      - key: AUTH_SECRET
        fromService:
          type: web
          name: web-content-flow-staging-web
          envVarKey: AUTH_SECRET
      - key: RATE_LIMIT_SECRET
        fromService:
          type: web
          name: web-content-flow-staging-web
          envVarKey: RATE_LIMIT_SECRET
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
