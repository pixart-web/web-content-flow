name: Desktop

# L5: builds and launches the desktop edition on each operating system, since
# the Next.js server, argon2, sharp and PostgreSQL ship native binaries per
# platform. No secrets are used; nothing is published.

on:
  pull_request:
    paths:
      - "src/desktop/**"
      - "scripts/build-desktop.mjs"
      - "scripts/desktop-smoke.mjs"
      - "scripts/package-*.mjs"
      - "tests/desktop/**"
      - "tests/desktop-e2e/**"
      # The desktop end-to-end test walks the app's pages, so interface
      # changes must run it too (a home redesign once broke it unseen).
      - "src/app/**"
      - "src/components/**"
      - "src/features/**"
      - "playwright.desktop.config.ts"
      - ".github/workflows/desktop.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # prisma.config.ts reads it; generate and the desktop tests never connect.
  DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:1/placeholder

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 45 downloads its binary lazily; fetch it before launching.
      - run: node node_modules/electron/install.js
      - run: pnpm prisma:generate
      # L8: register the password-reset polkit action, as the .deb does, so
      # the desktop tests can check that polkit accepts it.
      - name: Install the polkit action (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq polkitd pkexec > /dev/null || sudo apt-get install -y -qq policykit-1 > /dev/null
          sudo install -m 644 src/desktop/linux/com.webcontentflow.desktop.policy /usr/share/polkit-1/actions/
          echo "WCF_POLKIT_POLICY_INSTALLED=1" >> "$GITHUB_ENV"
      - name: Embedded PostgreSQL and OS authentication tests
        run: pnpm test:desktop
      - name: Build the desktop app for this platform
        run: pnpm build:desktop
      - name: Launch the desktop app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb gnome-keyring dbus-x11 > /dev/null
          dbus-run-session -- bash -c 'echo "" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && xvfb-run -a node scripts/desktop-smoke.mjs --no-sandbox --disable-gpu'
      - name: Launch the desktop app
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs
      # LF-21: owner journey across two launches with an offline guard that
      # refuses every connection leaving the machine (Playwright + Electron).
      - name: Desktop end-to-end test (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          WCF_DESKTOP_E2E_ARGS: --no-sandbox --disable-gpu
        run: dbus-run-session -- bash -c 'echo "" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && xvfb-run -a pnpm test:desktop:e2e'
      - name: Desktop end-to-end test
        if: runner.os != 'Linux'
        run: pnpm test:desktop:e2e
      - name: Upload the end-to-end trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-trace-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          node scripts/package-linux.mjs
          dpkg-deb -c dist/release/*.deb | grep -q "usr/share/polkit-1/actions/com.webcontentflow.desktop.policy"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: node scripts/package-windows.mjs
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: node scripts/package-macos.mjs
      - name: Upload unsigned packages
        uses: actions/upload-artifact@v7
        with:
          name: web-content-flow-desktop-${{ runner.os }}
          path: |
            dist/release/*.dmg
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/*.zip
          if-no-files-found: error
          retention-days: 14
