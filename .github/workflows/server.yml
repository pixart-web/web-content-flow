name: Server

# L7: builds the private-server image and runs the Compose stack with local
# HTTPS (Caddy's own CA), then checks migrations, health and restart.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/**"
      - "scripts/build-server.mjs"
      - "scripts/migrate.ts"
      - "src/server/db/**"
      - "prisma/**"
      - ".github/workflows/server.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test settings (throwaway secrets)
        run: |
          cat > .env.server <<EOF
          APP_URL=https://localhost:8443
          DOMAIN=localhost
          HTTP_PORT=8080
          HTTPS_PORT=8443
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          AUTH_SECRET=ci-only-$(openssl rand -hex 32)
          RATE_LIMIT_SECRET=$(openssl rand -hex 32)
          APP_MODE=server
          APP_ENV=production
          DATABASE_ENVIRONMENT=production
          ROLLOUT_STATE=INVITE_ONLY
          PUBLIC_REGISTRATION_ENABLED=false
          MARKETING_INDEXING_ENABLED=false
          EMAIL_PROVIDER=SMTP
          SMTP_HOST=smtp.test.invalid
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=test
          SMTP_PASSWORD=test-smtp-password
          EMAIL_FROM=noreply@test.invalid
          SUPPORT_EMAIL=support@test.invalid
          EOF
      - name: Start the stack
        run: |
          docker compose --env-file .env.server up -d --build
          for i in $(seq 1 60); do curl -fsk https://localhost:8443/health/ready && break; sleep 3; done
      - name: Checks over HTTPS
        run: |
          docker compose --env-file .env.server logs migrate | grep '"migrations.applied"'
          curl -fsk https://localhost:8443/health/live
          curl -fsk https://localhost:8443/health/ready | grep '"status":"ready"'
          # Postgres must not be published on the host (no "->" mapping).
          ! docker compose --env-file .env.server ps postgres --format '{{.Ports}}' | grep -F -- '->'
      - name: Restart keeps the data
        run: |
          docker compose --env-file .env.server down
          docker compose --env-file .env.server up -d
          for i in $(seq 1 60); do curl -fsk https://localhost:8443/health/ready && break; sleep 3; done
          docker compose --env-file .env.server logs migrate | grep '"count":0'
          curl -fsk https://localhost:8443/health/ready | grep '"status":"ready"'
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.server logs --tail 80
